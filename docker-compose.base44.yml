services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      - CI=true
      # The platform sets this to the preview host; Vite appends it to allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      [
        "sh",
        "-ec",
        "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000",
      ]
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  web_node_modules:
